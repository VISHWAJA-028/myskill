<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHESS BOARD</title>
    <title>Chess Box using Flex</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ddd;
        }

        .chessboard {
            width: 480px;
            height: 480px;
            display: flex;
            flex-wrap: wrap; /* Important for 8x8 layout */
            border: 4px solid black;
        }

        .square {
            width: 60px;
            height: 60px;
        }

        /* Black squares pattern */
        .square:nth-child(16n+1),
        .square:nth-child(16n+3),
        .square:nth-child(16n+5),
        .square:nth-child(16n+7),
        .square:nth-child(16n+10),
        .square:nth-child(16n+12),
        .square:nth-child(16n+14),
        .square:nth-child(16n+16) {
            background-color: black;
        }

        /* White squares */
        .square {
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="chessboard">
    <!-- 64 Squares -->
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>

    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>

    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>

    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>

    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>

    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>

    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>

    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
    <div class="square"></div><div class="square"></div>
</div>
    
</body>
</html>
