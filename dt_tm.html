<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: honeydew;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
    </style>
</head>
<h2>javascript date and time</h2>
<body>
    
    <script>
        let d= new Date();
        document.write("getDate():" +d.getDate()+"<br>");
        document.write("getFullYear():"+d.getFullYear()+"<br>");
        document.write("getMonth():"+d.getMonth()+"<br>");
        document.write("getTime():" +d.getTime()+"<br>");
        document.write("getHours():"+d.getHours()+"<br>");
        document.write("getMilliseconds():"+d.getMilliseconds()+"<br>");
        document.write("getMinutes():"+d.getMinutes()+"<br>");
        document.write("getDay():"+d.getDay()+"<br>");
        document.write("getSeconds:"+d.getSeconds()+"<br>");
        document.write("<hr>");
        document.write("getUTCMinutes():"+d.getUTCMinutes()+"<br>");
        document.write("getUTCDate():" +d.getUTCDate()+"<br>");
        document.write("getUTCFullYear():"+d.getUTCFullYear()+"<br>");
        document.write("getUTCDay():"+d.getUTCDay()+"<br>");
        document.write("getUTCTime():" +d.getUTCTime()+"<br>");
    </script>
</body>
</html>
