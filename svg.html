<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svgt</title>
</head>
<body>
    <h2>SVG Graphics Example</h2>

<svg width="400" height="300" style="border:1px solid black">
     <rect x="50" y="50" width="100" height="80" 
          fill="blue" stroke="black" stroke-width="3" />

    <circle cx="250" cy="100" r="50" 
            fill="red" stroke="black" stroke-width="3" />

    <line x1="50" y1="200" x2="350" y2="200" 
          stroke="green" stroke-width="4" />

    <text x="120" y="250" font-size="20" fill="purple">
        SVG Example
    </text>

</svg>
</body>
</html>
