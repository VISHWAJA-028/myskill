<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
div{
border:10px solid ;
color: darkgreen;
}
p{
border:5px solid red

left:50px;
}
div{

}
p{

}
.fix{

}
.stk{
position: sticky;
top: 200px;
}

background-color: aqua;
height: 20px;
}
div{
border: 10px solid green;
position: relative;
}
p{

}

}
</style>
</div>

</head>
<body>
<h1>1.Relative Positioning</h1>
<d iv >

<div>
<p>Paragraph 1</p>
<p class="fix">Paragraph 2</p>
<p class="stk">Paragraph 3</p>
</div>
<div class="observe">
hello
</div>
</div>

<d iv >
